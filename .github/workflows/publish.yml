# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── HOW NPM TRUSTS THIS WORKFLOW ──────────────────────────────────────────────
#
# npm trusted publishing (OIDC) is set up for this package: npm accepts a
# publish only from repository penfieldlabs/n8n-nodes-penfield, workflow
# publish.yml. No npm token is stored in this repository. If an NPM_TOKEN
# secret is ever added (only needed if trusted publishing is removed), the
# Release step writes it to .npmrc and npm uses it instead.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# See RELEASING.md. In short: set the version in package.json and add it to
# CHANGELOG.md on main, then push a tag with the same version (e.g. 0.2.0).
# The workflow refuses a tag that does not match the package.json version or
# that points at a commit which is not on main.
# Do not run `npm run release` locally: there it bumps the version and
# rewrites CHANGELOG.md. In this workflow it only lints, builds and publishes.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the next step can check that the tag is on main.
          fetch-depth: 0

      - name: Check the tag
        # Publish only a tag that matches package.json and points at a commit on main.
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Build and unit tests
        run: |
          npm run build
          npm test

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # With no NPM_TOKEN secret, npm authenticates through trusted publishing (OIDC).
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
